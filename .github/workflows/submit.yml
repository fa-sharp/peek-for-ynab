name: "Publish"
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22.23"

defaults:
  run:
    working-directory: extension

jobs:
  submit:
    name: Submit to Web Stores
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: extension/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: Package into zip artifact
        env:
          PUBLIC_MAIN_URL: https://peekforynab.com
        run: pnpm run build:zip

      - name: Submit to stores
        run: pnpm wxt submit --chrome-zip build/*-chrome.zip
        ## --firefox-zip build/*-firefox.zip --firefox-sources-zip build/*-sources.zip
        env:
          CHROME_API_VERSION: "v2"
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_KEY }}
          CHROME_SKIP_REVIEW: "false"
          CHROME_CANCEL_PENDING: "true"
          CHROME_DEPLOY_PERCENTAGE: "100"
          CHROME_PUBLISH_TYPE: "DEFAULT_PUBLISH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          working_directory: extension
          files: build/*-chrome.zip
          generate_release_notes: true
          make_latest: true
