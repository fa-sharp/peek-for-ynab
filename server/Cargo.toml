[package]
name = "peek-server"
edition = "2024"
rust-version = "1.96"
description = "Peek for YNAB backend server"
publish = false

[dependencies]
aes-gcm = { version = "0.10.3", features = ["std"] }
anyhow = "1.0.102"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-key-expansion", "cookie-private"] }
axum-helmet = "1.0.2"
axum-plugin = { git = "https://git.fasharp.io/fa-sharp/axum-plugin", rev = "d5f9ec2bc8" }
base64 = "0.23.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "gzip", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.21.0", default-features = false, features = ["alloc", "hex", "macros"] }
simple-oauth = { version = "0.1.0-beta.4", default-features = false, features = ["default-tls"] }
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", default-features = false, features = ["net", "rt", "rt-multi-thread", "signal"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7.0", features = ["cors", "fs", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
axum-test = "21.0.0"
httpmock = { version = "0.8.3", default-features = false }
